name: Build and publish
on:
  push:
    tags:
      - '*'
    branches:
      - 'main'

permissions:
  contents: write
  packages: write

env: 
  PHP_VERSION: 8.3.36

jobs:
  build_publish:
    name: Build and publish docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker CLI
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: > 
            ghcr.io/awbari/php-caddy:latest,
            ghcr.io/awbari/php-caddy:${{ env.PHP_VERSION }},
            ghcr.io/awbari/php-caddy:8.3,
            ghcr.io/awbari/php-caddy:8
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.PHP_VERSION }}
